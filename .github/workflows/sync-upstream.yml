# dbb-feedback 上游同步工作流
# 用途：定期从 linkcraftstudio/feedlog 拉取最新代码，保持 fork 与上游同步
# 存放位置：imoyao/ddb-feedback/.github/workflows/sync-upstream.yml

name: Sync Upstream

# 同步策略：merge（默认）。保留本仓库 DDDB feedback 的定制，不静默覆盖。
# 上游新增内容被合入；如遇真实冲突，工作流会建 issue 交由人工解决。

on:
  schedule:
    # 每周日 03:00 UTC 自动同步（对应北京时间 11:00）
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 避免旧运行与新运行冲突
    concurrency:
      group: sync-upstream-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史以支持合并
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 配置上游远程仓库
        run: |
          git remote add upstream https://github.com/linkcraftstudio/feedlog.git
          git fetch upstream main --no-tags

      - name: 检查是否有更新
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)

          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "local=$LOCAL_SHA" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "已是最新，无需同步"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "上游有更新: $LOCAL_SHA -> $UPSTREAM_SHA"
          fi

      - name: 执行合并（merge 策略，保留本仓库定制）
        if: steps.check.outputs.changed == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 普通 merge：上游新增内容被合入，本仓库（DDDB feedback）的定制原样保留。
          # 不使用 --strategy-option theirs —— 该选项会在冲突时以远端覆盖本地，
          # 静默丢弃我们对 feedlog 的定制，与「保留定制」目标相悖。
          # 若发生真实冲突，merge 失败，下方会建 issue 交由人工解决，绝不自动覆盖。
          if ! git merge upstream/main --no-edit 2>&1; then
            # 先记录冲突文件清单（abort 之后工作区不再有冲突标记，取不到）
            FILES=$(git diff --name-only --diff-filter=U | tr '\n' ', ')
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflict_files=$FILES" >> "$GITHUB_OUTPUT"
            echo "合并冲突，冲突文件：$FILES（稍后自动创建 Issue，不会以远端覆盖本地定制）"
            # 中止本次 merge，避免工作区残留冲突标记
            git merge --abort
          else
            echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送更新
        if: steps.check.outputs.changed == 'true' && steps.merge.outputs.has_conflict != 'true'
        run: |
          git push origin main
          echo "已同步上游更新并推送到 origin/main"

      - name: 冲突时自动创建 Issue
        if: steps.merge.outputs.has_conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictFiles = '${{ steps.merge.outputs.conflict_files }}';
            const body = `## 上游 (linkcraftstudio/feedlog) 合并冲突

            以下文件存在冲突，需要手动解决：

            ${conflictFiles}

            ### 解决步骤

            1. \`git checkout main && git pull\`
            2. 手动解决上述文件的冲突标记
            3. \`git add . && git merge --continue\`
            4. \`git push origin main\`

            > 由 Sync Upstream workflow 自动创建`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '上游 feedlog 合并冲突 - 需手动解决',
              body: body,
              labels: ['upstream', 'conflict']
            });
